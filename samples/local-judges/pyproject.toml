[project]
name = "local-judges"
version = "0.1.0"
description = "Same judgments from d3-flash, an LLM read from logprobs, LLM JSON, and a few-label baseline"
requires-python = ">=3.12"
dependencies = [
    "langchain-typesafe==0.0.1a3",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
