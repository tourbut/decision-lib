[project]
name = "context-gate"
version = "0.1.0"
description = "Need-based tool-result compaction and a memory write gate with the local d3-flash decision model"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-typesafe==0.0.1a3",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
