[project]
name = "discovery-review"
version = "0.1.0"
description = "E-discovery page review with LangGraph and the local d3-flash decision model"
requires-python = ">=3.12"
dependencies = [
    "langchain-typesafe==0.0.1a3",
    "langgraph>=1.2",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
