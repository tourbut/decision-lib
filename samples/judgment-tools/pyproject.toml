[project]
name = "judgment-tools"
version = "0.1.0"
description = "Decision-model judgments exposed as MCP tools, backed by the local d3-flash"
requires-python = ">=3.12"
dependencies = [
    "langchain-typesafe==0.0.1a3",
    "mcp>=1.10",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
