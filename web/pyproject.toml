[project]
name = "decision-lib-web"
version = "0.1.0"
description = "Browser workbench for the decision-lib samples"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Union of the samples' runtime dependencies, since adapters import their code.
    "langchain-typesafe==0.0.1a3",
    "langchain>=1.0",
    "langgraph>=1.2",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
    "mcp>=1.10",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
